name: Deploy team websites

on:
  push:
    branches:
      - main
    paths:
      - 'good-morning-aishu/**'
      - 'tanu-farewell/**'
      - '.github/workflows/deploy-good-morning-aishu.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble both websites
        run: |
          rm -rf _site
          mkdir -p _site/tanu-farewell
          cp -a good-morning-aishu/. _site/
          cp -a tanu-farewell/. _site/tanu-farewell/
          touch _site/.nojekyll

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
